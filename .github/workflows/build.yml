name: Build desktop apps

# Builds the macOS .dmg and the Windows installer.
# - Push a version tag (e.g. v1.0.0)  -> builds both and publishes a
#   GitHub Release with the downloadable files attached.
# - "Run workflow" button (workflow_dispatch) -> builds both and leaves
#   them as downloadable artifacts, without making a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: NeuroCogProfile-macos.dmg
          - os: windows-latest
            artifact: NeuroCogProfile-windows-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash build/build_macos.sh

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build\build_windows.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
